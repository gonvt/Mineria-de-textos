[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eonlp"
version = "1.0.0"
description = "NLP basado en reglas y clasificación temática de textos en Esperanto (práctica de Minería de Textos)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat>=5", "nbconvert>=7", "ipykernel", "matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/gonvt/Mineria-de-textos"

[tool.setuptools]
packages = ["eonlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
